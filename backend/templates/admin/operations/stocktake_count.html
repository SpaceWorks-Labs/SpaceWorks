{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
  <p>{% blocktranslate trimmed with pk=stocktake.pk stocktake=stocktake %}Stocktake #{{ pk }}: {{ stocktake }}{% endblocktranslate %}</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <div class="submit-row">
      <input type="submit" value="Add count line" class="default">
    </div>
  </form>
{% endblock %}
