x-spaceworks-host-orchestration:
  scheduler:
    mode: image
    services: [beat]
  pointer:
    mode: atomic-file
    path: /var/lib/spaceworks/ops/database-pointer.env
    static_environment: .env
  database_identity: endpoint-plus-queried-uuid
  writer_services: [backend, live, worker, beat]
  sibling_lifecycle: bundled-owned-database
services:
  db:
    image: postgres:16
    container_name: spaceworks-db
    environment:
      POSTGRES_USER: makerspace
      POSTGRES_PASSWORD: makerspace
      POSTGRES_DB: makerspace_manager
    ports:
      - "5432:5432"
    volumes:
      - makerspace_manager_pgdata:/var/lib/postgresql/data
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U makerspace -d makerspace_manager"], interval: 5s, timeout: 5s, retries: 5}
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z  # maintained fork of the archived MinIO; reuses minio_data as-is
    container_name: spaceworks-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck: {test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"], interval: 5s, timeout: 5s, retries: 5}
  createbuckets:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z  # bundles mc for bucket setup
    container_name: spaceworks-minio-createbuckets
    depends_on: {minio: {condition: service_healthy}}
    entrypoint: |
      /bin/sh -c '
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/evidence;
      mc version enable local/evidence;
      mc anonymous set none local/evidence;
      mc mb --ignore-existing local/public-images;
      mc version enable local/public-images;
      mc anonymous set download local/public-images;
      '
  redis:
    image: redis:7-alpine
    container_name: spaceworks-redis
    restart: unless-stopped
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 5s, retries: 5}
  backend:
    build:
      context: ./backend
    container_name: spaceworks-backend
    environment: &backend-env
      PII_ENCRYPTION_ENABLED: ${PII_ENCRYPTION_ENABLED:-False}
      PII_ENCRYPTION_DUAL_READ: ${PII_ENCRYPTION_DUAL_READ:-True}
      PII_KEY_BROKER: ${PII_KEY_BROKER:-local}
      PII_MASTER_KEY: ${PII_MASTER_KEY:-}
      PII_MASTER_KEY_PREVIOUS: ${PII_MASTER_KEY_PREVIOUS:-}
      PII_SEARCH_HASH_KEY: ${PII_SEARCH_HASH_KEY:-}
      PII_DEK_CACHE_TTL_SECONDS: ${PII_DEK_CACHE_TTL_SECONDS:-300}
      PII_AWS_KMS_KEY_ID: ${PII_AWS_KMS_KEY_ID:-}
      PII_AWS_KMS_REGION: ${PII_AWS_KMS_REGION:-}
      PII_AWS_KMS_ENDPOINT_URL: ${PII_AWS_KMS_ENDPOINT_URL:-}
      UPLOAD_SCAN_POLICY: ${UPLOAD_SCAN_POLICY:-}
      CLAMD_HOST: ${CLAMD_HOST:-}
      CLAMD_PORT: ${CLAMD_PORT:-3310}
      CLAMD_TIMEOUT_SECONDS: ${CLAMD_TIMEOUT_SECONDS:-5}
      CLAMD_MAX_SCAN_BYTES: ${CLAMD_MAX_SCAN_BYTES:-2147483648}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      EMAIL_PROVIDER_CONFIG_FILE: ${EMAIL_PROVIDER_CONFIG_FILE:-}
      EMAIL_PROVIDER_WEBHOOKS_ENABLED: ${EMAIL_PROVIDER_WEBHOOKS_ENABLED:-False}
      EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-10}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-us-east-1}
      STORAGE_CAPABILITIES_FILE: ${STORAGE_CAPABILITIES_FILE:-}
      STORAGE_CAPABILITY_TTL_SECONDS: ${STORAGE_CAPABILITY_TTL_SECONDS:-900}
      TRUST_FORWARDED_HOST: ${TRUST_FORWARDED_HOST:-False}
      TRUSTED_EDGE_CIDRS: ${TRUSTED_EDGE_CIDRS:-}
      TRUSTED_EDGE_UPSTREAM_HOSTS: ${TRUSTED_EDGE_UPSTREAM_HOSTS:-}
      TRUSTED_EDGE_INGRESS_SECRET: ${TRUSTED_EDGE_INGRESS_SECRET:-}
      DATABASE_CONNECTION_MODE: ${DATABASE_CONNECTION_MODE:-direct}
      CONN_HEALTH_CHECKS: ${CONN_HEALTH_CHECKS:-True}
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-change-me}
      EVENT_STATION_PIN_PEPPER: ${EVENT_STATION_PIN_PEPPER:-}
      SPACEWORKS_EDITION: ${SPACEWORKS_EDITION:-makerspace}
      WEB_ANALYTICS_SCRIPT_URL: ${WEB_ANALYTICS_SCRIPT_URL:-}
      WEB_ANALYTICS_COLLECT_URL: ${WEB_ANALYTICS_COLLECT_URL:-}
      WEB_ANALYTICS_DOMAIN: ${WEB_ANALYTICS_DOMAIN:-}
      NOTIFICATION_SLACK_REDIRECT_URI: ${NOTIFICATION_SLACK_REDIRECT_URI:-}
      NOTIFICATION_MATTERMOST_REDIRECT_URI: ${NOTIFICATION_MATTERMOST_REDIRECT_URI:-}
      NOTIFICATION_DISCORD_REDIRECT_URI: ${NOTIFICATION_DISCORD_REDIRECT_URI:-}
      NOTIFICATION_MATTERMOST_ALLOW_PRIVATE_HOSTS: ${NOTIFICATION_MATTERMOST_ALLOW_PRIVATE_HOSTS:-False}
      WHATSAPP_META_GRAPH_VERSION: ${WHATSAPP_META_GRAPH_VERSION:-v25.0}
      ROUTE_METRICS_ENABLED: ${ROUTE_METRICS_ENABLED:-False}
      PROMETHEUS_MULTIPROC_DIR: ${PROMETHEUS_MULTIPROC_DIR:-/tmp/spaceworks-prometheus}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      ORGANIZATION_SELF_CREATION_ENABLED: ${ORGANIZATION_SELF_CREATION_ENABLED:-False}
      ORGANIZATION_SELF_CREATION_MAX_OWNED: ${ORGANIZATION_SELF_CREATION_MAX_OWNED:-3}
      ORGANIZATION_SELF_CREATION_MAX_PER_DAY: ${ORGANIZATION_SELF_CREATION_MAX_PER_DAY:-1}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_APP_USER:-spaceworks_app}:${POSTGRES_APP_PASSWORD:-spaceworks-app-dev}@db:5432/makerspace_manager}
      SPACEWORKS_DB_POINTER_GENERATION: ${SPACEWORKS_DB_POINTER_GENERATION:-1}
      MANAGED_POSTGRES: ${MANAGED_POSTGRES:-False}
      CONN_MAX_AGE: ${CONN_MAX_AGE:-60}
      DISABLE_SERVER_SIDE_CURSORS: ${DISABLE_SERVER_SIDE_CURSORS:-False}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173}
      API_CLIENT_ENC_KEY: ${API_CLIENT_ENC_KEY:-}
      AUDIT_MAC_MASTER_KEY: ${AUDIT_MAC_MASTER_KEY:-}
      AUDIT_ATTESTATION_DEPLOYMENT_ID: ${AUDIT_ATTESTATION_DEPLOYMENT_ID:-}
      AUDIT_ATTESTATION_ANCHOR_BACKEND: ${AUDIT_ATTESTATION_ANCHOR_BACKEND:-}
      AUDIT_ATTESTATION_S3_BUCKET: ${AUDIT_ATTESTATION_S3_BUCKET:-}
      AUDIT_ATTESTATION_S3_PREFIX: ${AUDIT_ATTESTATION_S3_PREFIX:-}
      AUDIT_ATTESTATION_RETENTION_DAYS: ${AUDIT_ATTESTATION_RETENTION_DAYS:-2555}
      AUDIT_ATTESTATION_S3_OBJECT_LOCK_MODE: ${AUDIT_ATTESTATION_S3_OBJECT_LOCK_MODE:-}
      AUDIT_ATTESTATION_S3_ENDPOINT_URL: ${AUDIT_ATTESTATION_S3_ENDPOINT_URL:-}
      AUDIT_ATTESTATION_S3_ACCESS_KEY_ID: ${AUDIT_ATTESTATION_S3_ACCESS_KEY_ID:-}
      AUDIT_ATTESTATION_S3_SECRET_ACCESS_KEY: ${AUDIT_ATTESTATION_S3_SECRET_ACCESS_KEY:-}
      AUDIT_ATTESTATION_S3_REGION_NAME: ${AUDIT_ATTESTATION_S3_REGION_NAME:-}
      AUDIT_ATTESTATION_HTTP_URL: ${AUDIT_ATTESTATION_HTTP_URL:-}
      AUDIT_ATTESTATION_HTTP_BEARER_TOKEN: ${AUDIT_ATTESTATION_HTTP_BEARER_TOKEN:-}
      AUDIT_ATTESTATION_HTTP_TIMEOUT: ${AUDIT_ATTESTATION_HTTP_TIMEOUT:-10}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-False}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-Lax}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-evidence}
      PUBLIC_IMAGE_BUCKET: ${PUBLIC_IMAGE_BUCKET:-public-images}
      PUBLIC_IMAGE_BASE_URL: ${PUBLIC_IMAGE_BASE_URL:-http://localhost:9000/public-images}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://minio:9000}
      AWS_S3_PUBLIC_ENDPOINT_URL: ${AWS_S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      STORAGE_PRESIGN_METHOD: ${STORAGE_PRESIGN_METHOD:-post}
      EVIDENCE_OBJECT_RETENTION_DAYS: ${EVIDENCE_OBJECT_RETENTION_DAYS:-365}
      EVIDENCE_OBJECT_EXPIRY_ENABLED: ${EVIDENCE_OBJECT_EXPIRY_ENABLED:-False}
      EVIDENCE_RETENTION_BATCH_SIZE: ${EVIDENCE_RETENTION_BATCH_SIZE:-100}
      EVIDENCE_ABANDONED_UPLOAD_CLEANUP_ENABLED: ${EVIDENCE_ABANDONED_UPLOAD_CLEANUP_ENABLED:-False}
      EVIDENCE_ABANDONED_UPLOAD_RETENTION_DAYS: ${EVIDENCE_ABANDONED_UPLOAD_RETENTION_DAYS:-7}
      HMAC_CLIENT_ID: ${HMAC_CLIENT_ID:-}
      HMAC_SECRET: ${HMAC_SECRET:-}
      HMAC_MAX_CLOCK_SKEW_SECONDS: ${HMAC_MAX_CLOCK_SKEW_SECONDS:-300}
      APICLIENT_REQUIRE_NONCE: ${APICLIENT_REQUIRE_NONCE:-False}
      HMAC_PROTECTED_PATH_PREFIXES: ${HMAC_PROTECTED_PATH_PREFIXES:-/api/public/,/api/v1/public/}
      CRON_SECRET: ${CRON_SECRET:-}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Makerspace <noreply@makerspace.local>}
      PUBLIC_APP_BASE_URL: ${PUBLIC_APP_BASE_URL:-}
      STRIPE_CONNECT_REDIRECT_URI: ${STRIPE_CONNECT_REDIRECT_URI:-}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_ARCHIVE_SIGNING_PRIVATE_KEY: ${BACKUP_ARCHIVE_SIGNING_PRIVATE_KEY:-}
      BACKUP_ARCHIVE_VERIFY_PUBLIC_KEY: ${BACKUP_ARCHIVE_VERIFY_PUBLIC_KEY:-}
      BACKUP_OPS_DIR: /var/lib/spaceworks/ops/work
      SPACEWORKS_HOST_MARKER_PATH: /run/spaceworks-host/restore-marker.json
      BACKUP_PRODUCER_CAPABILITY_MARKER_PATH: /run/spaceworks-host/producer-capability.json
      BACKUP_PRODUCER_PRIVILEGED_SCRIPTS_DIR: /run/spaceworks-privileged-scripts
    command: ["--role", "backend", "sh", "-c", "python manage.py collectstatic --noinput && gunicorn --config python:config.gunicorn_metrics config.wsgi:application --bind 0.0.0.0:8000"]
    healthcheck: {test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/', timeout=3).read()\""], interval: 10s, timeout: 5s, retries: 6}
    ports:
      - "8001:8000"
    volumes:
      - ${SPACEWORKS_OPS_HOST_DIR:-/var/lib/spaceworks/ops}/work:/var/lib/spaceworks/ops/work
      - ${SPACEWORKS_OPS_HOST_DIR:-/var/lib/spaceworks/ops}/operation.lock:/var/lib/spaceworks/ops/operation.lock
      - ${SPACEWORKS_HOST_STATE_DIR:-/var/lib/spaceworks/host}/public:/run/spaceworks-host:ro
      - ./scripts:/run/spaceworks-privileged-scripts:ro
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}, orchestration-ready: {condition: service_completed_successfully}}
  live:
    build:
      context: ./backend
    container_name: spaceworks-live
    environment: *backend-env
    command: ["--role", "backend", "gunicorn", "--config", "python:config.gunicorn_metrics", "config.wsgi:application", "--bind", "0.0.0.0:8000", "-k", "gthread", "--threads", "32", "--timeout", "0"]
    volumes:
      - ${SPACEWORKS_HOST_STATE_DIR:-/var/lib/spaceworks/host}/public:/run/spaceworks-host:ro
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}, orchestration-ready: {condition: service_completed_successfully}}
  orchestration-init:
    build:
      context: ./backend
    user: "0:0"
    entrypoint: ["python", "/app/scripts/bootstrap_host_orchestration.py"]
    environment:
      DATABASE_URL: postgres://makerspace:makerspace@db:5432/makerspace_manager
      SPACEWORKS_RUNTIME_DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_APP_USER:-spaceworks_app}:${POSTGRES_APP_PASSWORD:-spaceworks-app-dev}@db:5432/makerspace_manager}
      SPACEWORKS_PRIVILEGED_TARGET_REQUIRED: ${SPACEWORKS_PRIVILEGED_TARGET_REQUIRED:-0}
      SPACEWORKS_PRIVILEGED_TARGET_NAME: ${SPACEWORKS_PRIVILEGED_TARGET_NAME:-}
      SPACEWORKS_PRIVILEGED_TARGET_OID: ${SPACEWORKS_PRIVILEGED_TARGET_OID:-}
      SPACEWORKS_PRIVILEGED_TARGET_UUID: ${SPACEWORKS_PRIVILEGED_TARGET_UUID:-}
      SPACEWORKS_INITIALIZE_DATABASE_NAME: ${SPACEWORKS_INITIALIZE_DATABASE_NAME:-}
      SPACEWORKS_INITIALIZE_DATABASE_OID: ${SPACEWORKS_INITIALIZE_DATABASE_OID:-}
      SPACEWORKS_HOST_MARKER_WRITE_PATH: /host-state/restore-marker.json
      SPACEWORKS_SCHEDULER_MODE: image
      SPACEWORKS_SCHEDULER_SERVICES: beat
    volumes:
      - ${SPACEWORKS_HOST_STATE_DIR:-/var/lib/spaceworks/host}/public:/host-state
    depends_on: {db: {condition: service_healthy}}
  migrate:
    build:
      context: ./backend
    container_name: spaceworks-migrate
    environment:
      <<: *backend-env
      DATABASE_URL: postgres://makerspace:makerspace@db:5432/makerspace_manager
      SPACEWORKS_RUNTIME_DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_APP_USER:-spaceworks_app}:${POSTGRES_APP_PASSWORD:-spaceworks-app-dev}@db:5432/makerspace_manager}
      SPACEWORKS_PRIVILEGED_TARGET_REQUIRED: ${SPACEWORKS_PRIVILEGED_TARGET_REQUIRED:-0}
      SPACEWORKS_PRIVILEGED_TARGET_NAME: ${SPACEWORKS_PRIVILEGED_TARGET_NAME:-}
      SPACEWORKS_PRIVILEGED_TARGET_OID: ${SPACEWORKS_PRIVILEGED_TARGET_OID:-}
      SPACEWORKS_PRIVILEGED_TARGET_UUID: ${SPACEWORKS_PRIVILEGED_TARGET_UUID:-}
    command: ["--role", "migrate", "python", "manage.py", "migrate"]
    volumes:
      - ${SPACEWORKS_OPS_HOST_DIR:-/var/lib/spaceworks/ops}/work:/var/lib/spaceworks/ops/work
      - ${SPACEWORKS_OPS_HOST_DIR:-/var/lib/spaceworks/ops}/operation.lock:/var/lib/spaceworks/ops/operation.lock
      - ${SPACEWORKS_HOST_STATE_DIR:-/var/lib/spaceworks/host}/public:/run/spaceworks-host:ro
    depends_on: {orchestration-init: {condition: service_completed_successfully}}
  orchestration-ready:
    build:
      context: ./backend
    user: "0:0"
    entrypoint: ["python", "/app/scripts/bootstrap_host_orchestration.py"]
    environment:
      DATABASE_URL: postgres://makerspace:makerspace@db:5432/makerspace_manager
      SPACEWORKS_RUNTIME_DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_APP_USER:-spaceworks_app}:${POSTGRES_APP_PASSWORD:-spaceworks-app-dev}@db:5432/makerspace_manager}
      SPACEWORKS_PRIVILEGED_TARGET_REQUIRED: ${SPACEWORKS_PRIVILEGED_TARGET_REQUIRED:-0}
      SPACEWORKS_PRIVILEGED_TARGET_NAME: ${SPACEWORKS_PRIVILEGED_TARGET_NAME:-}
      SPACEWORKS_PRIVILEGED_TARGET_OID: ${SPACEWORKS_PRIVILEGED_TARGET_OID:-}
      SPACEWORKS_PRIVILEGED_TARGET_UUID: ${SPACEWORKS_PRIVILEGED_TARGET_UUID:-}
      SPACEWORKS_INITIALIZE_DATABASE_NAME: ${SPACEWORKS_INITIALIZE_DATABASE_NAME:-}
      SPACEWORKS_INITIALIZE_DATABASE_OID: ${SPACEWORKS_INITIALIZE_DATABASE_OID:-}
      SPACEWORKS_HOST_MARKER_WRITE_PATH: /host-state/restore-marker.json
      SPACEWORKS_SCHEDULER_MODE: image
      SPACEWORKS_SCHEDULER_SERVICES: beat
    volumes:
      - ${SPACEWORKS_HOST_STATE_DIR:-/var/lib/spaceworks/host}/public:/host-state
    depends_on: {migrate: {condition: service_completed_successfully}}
  worker:
    build:
      context: ./backend
    container_name: spaceworks-worker
    restart: unless-stopped
    environment: *backend-env
    command: ["--role", "worker", "celery", "-A", "config", "worker", "-l", "info"]
    volumes:
      - ${SPACEWORKS_OPS_HOST_DIR:-/var/lib/spaceworks/ops}/work:/var/lib/spaceworks/ops/work
      - ${SPACEWORKS_OPS_HOST_DIR:-/var/lib/spaceworks/ops}/operation.lock:/var/lib/spaceworks/ops/operation.lock
      - ${SPACEWORKS_HOST_STATE_DIR:-/var/lib/spaceworks/host}/public:/run/spaceworks-host:ro
      - ./scripts:/run/spaceworks-privileged-scripts:ro
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}, orchestration-ready: {condition: service_completed_successfully}}
  beat:
    build:
      context: ./backend
    container_name: spaceworks-beat
    restart: unless-stopped
    environment: *backend-env
    command: ["--role", "beat", "celery", "-A", "config", "beat", "-l", "info", "--schedule", "/var/lib/celery/celerybeat-schedule"]
    volumes:
      - celerybeat_data:/var/lib/celery
      - ${SPACEWORKS_OPS_HOST_DIR:-/var/lib/spaceworks/ops}/work:/var/lib/spaceworks/ops/work
      - ${SPACEWORKS_OPS_HOST_DIR:-/var/lib/spaceworks/ops}/operation.lock:/var/lib/spaceworks/ops/operation.lock
      - ${SPACEWORKS_HOST_STATE_DIR:-/var/lib/spaceworks/host}/public:/run/spaceworks-host:ro
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}, orchestration-ready: {condition: service_completed_successfully}}
  candidate-backend:
    profiles: [host-recovery]
    build:
      context: ./backend
    environment: *backend-env
    command: ["--role", "backend", "gunicorn", "--config", "python:config.gunicorn_metrics", "config.wsgi:application", "--bind", "0.0.0.0:8000"]
    volumes:
      - ${SPACEWORKS_OPS_HOST_DIR:-/var/lib/spaceworks/ops}/work:/var/lib/spaceworks/ops/work
      - ${SPACEWORKS_OPS_HOST_DIR:-/var/lib/spaceworks/ops}/operation.lock:/var/lib/spaceworks/ops/operation.lock
      - ${SPACEWORKS_HOST_STATE_DIR:-/var/lib/spaceworks/host}/public:/run/spaceworks-host:ro
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}}
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_TENANT_TOKEN: ${VITE_TENANT_TOKEN:-}
        VITE_PUBLIC_API_KEY: ${VITE_PUBLIC_API_KEY:-}
        VITE_PUBLIC_CLIENT_ID: ${VITE_PUBLIC_CLIENT_ID:-}
    environment:
      TENANT_API_URL: ${TENANT_API_URL:-/api}
      TENANT_TOKEN: ${TENANT_TOKEN:-}
      WEB_ANALYTICS_SCRIPT_URL: ${WEB_ANALYTICS_SCRIPT_URL:-}
      WEB_ANALYTICS_COLLECT_URL: ${WEB_ANALYTICS_COLLECT_URL:-}
      WEB_ANALYTICS_DOMAIN: ${WEB_ANALYTICS_DOMAIN:-}
      WEB_ANALYTICS_EXTRA_CONNECT_ORIGINS: ${WEB_ANALYTICS_EXTRA_CONNECT_ORIGINS:-}
    container_name: spaceworks-frontend
    ports:
      - "80:80"
    healthcheck: {test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"], interval: 10s, timeout: 5s, retries: 6}
    depends_on: {backend: {condition: service_healthy}}
volumes:
  makerspace_manager_pgdata:
  minio_data:
  celerybeat_data:
