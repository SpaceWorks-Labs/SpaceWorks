map $http_x_forwarded_proto $external_scheme {
    default $scheme;
    https https;
}
server {
    listen 80;
    server_name _;

    location = /.well-known/assetlinks.json {
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $external_scheme;
    }

    location = /.well-known/apple-app-site-association {
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $external_scheme;
    }

    # Never record raw API/share bearer paths or signed queries at this edge.
    access_log off;
    error_log /dev/null;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    # Calendar feed paths contain bearer credentials. Suppress both access and
    # upstream error logging before the generic API matcher can capture them.
    location ~ ^/api/v1/(?:(?:public/[^/]+/(event-calendar|bookings/calendar)|admin/makerspaces/[0-9]+/maintenance/feed)/[^/]+\.ics|integrations/notification-media/[^/]+\.pdf)$ {
        access_log off;
        error_log /dev/null;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $external_scheme;
    }
    location /embed/ {
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $external_scheme;
    }
    # Shared website multipart ingress; backend enforces the 5 MB decoded input cap.
    location ~ ^/api/v1/admin/(?:(events|event-series|spaces)/[0-9]+/website|(?:makerspaces|organizations)/[0-9]+/public-page)/assets/$ {
        client_max_body_size 6m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $external_scheme;
    }

    location = /api/v1/internal { return 403; }
    location ^~ /api/v1/internal/ { return 403; }
    location = /api/v1/metrics { return 403; }
    location ^~ /api/v1/metrics/ { return 403; }
    location ^~ /api/v1/live/ {
        proxy_pass http://live:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $external_scheme;
    }
    # Tenant-migration archives: the backend enforces MAX_ARCHIVE_BYTES (20 GiB).
    location = /api/v1/admin/platform/tenant-migrations/imports {
        access_log off;
        client_max_body_size 20g;
        proxy_read_timeout 3600s;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $external_scheme;
    }
    # Bulk card photos (D314c): photos or a zip (the backend caps a zip at 200 MB and each photo at 8 MB).
    location ~ ^/api/v1/admin/makerspaces/[0-9]+/card-photo-batches/[0-9]+/files$ {
        client_max_body_size 220m;
        proxy_read_timeout 300s;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $external_scheme;
    }
    # Other uploads use presigned storage URLs; bulk import (5 MiB) is the largest API body.
    location ~ ^/(api/|static/|docs/|redoc/|schema/|share/|sitemap\.xml$|robots\.txt$) {
        access_log off;
        client_max_body_size 10m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $external_scheme;
    }
    location / { return 404; }
}
