name: Checks

# CHECKS ONLY (owner decision #108). The pytest and vitest suites are deliberately
# local-only and gitignored; nothing here runs them.
#
# Required status checks on main. These job ids and names are what branch protection
# matches, so keep them stable:
#   - frontend
#   - backend
#   - contracts
#   - rules
#   - version-bump   (runs on pull requests into main only; mark it required in branch protection)

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Dummy but valid settings for Django commands that never touch a database or a
# service. Nothing here is a secret: the job generates SECRET_KEY and the Fernet keys.
env:
  DEBUG: "True"
  TRUSTED_PROXY_COUNT: "0"
  ALLOWED_HOSTS: localhost,127.0.0.1
  DATABASE_URL: postgres://checks:checks@localhost:5432/checks
  EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Type-check and lint share no state, so they run side by side; both must pass.
      # frontend/eslint.config.js; warnings (react-hooks/exhaustive-deps) do not fail the job.
      - name: Type-check and lint
        shell: bash
        run: |
          set -uo pipefail
          npx tsc -b > "$RUNNER_TEMP/tsc.log" 2>&1 & tsc=$!
          npm run lint > "$RUNNER_TEMP/lint.log" 2>&1 & lint=$!
          wait "$tsc"; tsc_status=$?
          wait "$lint"; lint_status=$?
          echo "::group::tsc -b (exit $tsc_status)"; cat "$RUNNER_TEMP/tsc.log"; echo "::endgroup::"
          echo "::group::eslint (exit $lint_status)"; cat "$RUNNER_TEMP/lint.log"; echo "::endgroup::"
          ((tsc_status == 0 && lint_status == 0))

      # `npm run build` is `tsc -b` + this; the types were checked in the step above.
      - name: Build (includes the PWA verify script)
        run: npm run build:bundle

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/backend-python

      # Syntax errors, undefined names, redefinitions, repeated dict keys (~2 s).
      - name: Error lint (ruff)
        run: bash ../scripts/ci/lint_backend.sh

      - name: Generate throwaway keys
        run: python ../scripts/ci/throwaway_keys.py >> "$GITHUB_ENV"

      - name: Django system checks
        run: python manage.py check

      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/backend-python

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate throwaway keys
        run: python scripts/ci/throwaway_keys.py >> "$GITHUB_ENV"

      - name: OpenAPI snapshot matches the code
        working-directory: backend
        run: |
          python manage.py spectacular --format openapi-json --file "$RUNNER_TEMP/openapi-schema.json"
          if ! diff -u ../frontend/openapi-schema.json "$RUNNER_TEMP/openapi-schema.json"; then
            echo "::error file=frontend/openapi-schema.json::OpenAPI snapshot is stale. Regenerate it: cd backend && python manage.py spectacular --format openapi-json --file ../frontend/openapi-schema.json"
            exit 1
          fi

      - name: OpenAPI contract is complete (tags, security, bodies, errors)
        working-directory: backend
        run: python manage.py openapi_contract_check

      - name: Generated API client matches the snapshot
        working-directory: frontend
        run: |
          npm run generate:api
          if ! git diff --exit-code -- src/generated/api.ts; then
            echo "::error file=frontend/src/generated/api.ts::api.ts is stale. Regenerate it: cd frontend && npm run generate:api"
            exit 1
          fi

      - name: Tenant-dump catalog digest (CATALOG_SCHEMA_SHA256)
        working-directory: backend
        run: |
          python manage.py shell -c "from apps.tenant_migration.tenant_dump_catalog import validate_catalog; validate_catalog(); print('catalog digest ok')"

  rules:
    name: rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 300-line ceiling and CLAUDE.md/AGENTS.md twins
        run: python scripts/ci/check_rules.py

  # Every merge to main must bump VERSION. Only meaningful for PRs whose base is main;
  # for other events the job is skipped, which branch protection treats as passing.
  version-bump:
    name: version-bump
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: VERSION is strictly higher than main and everywhere consistent
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "${BASE_REF}"
          git show "origin/${BASE_REF}:VERSION" > "${RUNNER_TEMP}/base-version"
          git ls-remote --tags origin 'v*' | sed 's#.*refs/tags/##; s#\^{}$##' | sort -u > "${RUNNER_TEMP}/tags"
          python scripts/ci/check_version_bump.py \
            --base-file "${RUNNER_TEMP}/base-version" \
            --existing-tags "${RUNNER_TEMP}/tags"
