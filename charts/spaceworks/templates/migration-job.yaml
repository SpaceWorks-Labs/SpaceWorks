apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "spaceworks.name" . }}-migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- include "spaceworks.podSecurity" . | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "spaceworks.backendImage" . | quote }}
          # Maintenance credentials do not bypass H1 admission or set runtime ownership.
          args: [--role, migrate, python, manage.py, migrate, --noinput]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          envFrom:
            - secretRef:
                name: {{ required "runtimeSecret is required" .Values.runtimeSecret | quote }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "migrationPointerSecret is required" .Values.migrationPointerSecret | quote }}
                  key: DATABASE_URL
            - name: SPACEWORKS_DB_POINTER_GENERATION
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.migrationPointerSecret | quote }}
                  key: SPACEWORKS_DB_POINTER_GENERATION
            - name: SPACEWORKS_HOST_MARKER_PATH
              value: /run/spaceworks-host/restore-marker.json
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- include "spaceworks.mounts" . | nindent 12 }}
      volumes:
        {{- include "spaceworks.volumes" . | nindent 8 }}
