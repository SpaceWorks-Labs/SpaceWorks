name: Security Audit

# pip-audit against backend/requirements.txt. It runs when the requirements (or this
# workflow) change, and weekly, so newly published advisories against unchanged
# dependencies are still caught without re-auditing an untouched lockfile on every PR.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"
  pull_request:
    paths:
      - backend/requirements*.txt
      - .github/workflows/security-audit.yml
  push:
    branches: [dev, main]
    paths:
      - backend/requirements*.txt
      - .github/workflows/security-audit.yml

concurrency:
  group: security-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Enforcing: a vulnerable dependency change fails the check. If a specific
    # advisory is unfixable/transitive, add `--ignore-vuln <ID>` to the command below.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/security-audit.yml
      - name: Run pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt
