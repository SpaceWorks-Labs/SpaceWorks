map $http_user_agent $website_crawler {
    default 0;
    ~*(facebookexternalhit|Facebot|Twitterbot|LinkedInBot|Slackbot|Discordbot|WhatsApp|TelegramBot) 1;
}
map "$website_crawler:$uri" $profile_share_target {
    default "";
    "~*^1:/(?!(?:\.well\-known|about|admin|api|assets|bookings|checkout|config\.js|control|discover|docs|e|embed|event\-check\-in|events|favicon\.ico|guest\-admin|health|healthz|index\.html|install|items|kiosk|m|machines|media|member|member\-sw\.js|mfa|now|o|organization\-invitations|print|redoc|reset\-password|robots\.txt|scanner|schema|setup|share|sitemap\.xml|staff|staff\-invitations|static|stats|superadmin|sw\.js)/?$)(?<profile_share_handle>[a-z0-9](?:[a-z0-9._-]{1,28}[a-z0-9]))/?$" /share/pages/$profile_share_handle/;
}
map $http_x_forwarded_proto $external_scheme {
    default $scheme;
    https https;
}
server {
    listen 80;
    server_name _;

    location = /.well-known/assetlinks.json {
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $external_scheme;
    }

    location = /.well-known/apple-app-site-association {
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $external_scheme;
    }

    # Backend URLs may contain bearer paths or signed query strings. Application
    # audit/structured logs retain diagnostics without recording raw request URLs.
    access_log off;
    error_log /dev/null;
    # SPA includes own framing and optional analytics CSP.
    # Proxy locations suppress inherited headers so Django owns its policies.

    root /usr/share/nginx/html;
    index index.html;

    location = /sw.js {
        include /etc/nginx/analytics-headers.conf;
        add_header Cache-Control "no-cache";
        try_files /sw.js =404;
    }

    location = /member-sw.js {
        include /etc/nginx/analytics-headers.conf;
        add_header Cache-Control "no-cache";
        try_files /member-sw.js =404;
    }

    location = /browser-alerts-sw.js {
        include /etc/nginx/analytics-headers.conf;
        add_header Cache-Control "no-cache";
        try_files /browser-alerts-sw.js =404;
    }

    location = /index.html {
        include /etc/nginx/analytics-headers.conf;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location /assets/ {
        include /etc/nginx/analytics-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /config.js {
        include /etc/nginx/analytics-headers.conf;
        add_header Cache-Control "no-store";
        try_files /config.js =404;
    }

    # Internal infra-only endpoints (e.g. the on-demand-TLS ask) must never be
    # reachable from the public web. Caddy also blocks this; deny here as
    # defense-in-depth. Longest-prefix match wins over the /api/ block below.
    # Shared website multipart ingress; backend enforces the 5 MB decoded input cap.
    location ~ ^/api/v1/admin/(?:(events|event-series|spaces)/[0-9]+/website|(?:makerspaces|organizations)/[0-9]+/public-page)/assets/$ {
        client_max_body_size 6m;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $external_scheme;
    }

    location = /api/v1/internal { return 403; }
    location = /api/v1/metrics { return 403; }
    location ^~ /api/v1/metrics/ { return 403; }
    location ^~ /api/v1/internal/ {
        return 403;
    }

    # A calendar subscription URL is a bearer credential over member activity.
    # Do not write its raw path into nginx access logs; Django independently redacts
    # Gunicorn's WSGI request-line value before the backend access log is emitted.
    location ~ ^/api/v1/(?:(?:public/[^/]+/(event-calendar|bookings/calendar)|admin/makerspaces/[0-9]+/maintenance/feed)/[^/]+\.ics|integrations/notification-media/[^/]+\.pdf)$ {
        access_log off;
        error_log /dev/null;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $external_scheme;
    }

    # Server-Sent Events: a separate upstream (the `live` service) and no buffering, so
    # events reach the browser as they are published. Must sit above /api/ (longest prefix).
    location /api/v1/live/ {
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://live:8000/api/v1/live/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $external_scheme;
    }

    # Tenant-migration archives are the one direct API upload that can be large; the
    # backend enforces its own ceiling (import_staging.MAX_ARCHIVE_BYTES, 20 GiB).
    location = /api/v1/admin/platform/tenant-migrations/imports {
        client_max_body_size 20g;
        proxy_read_timeout 3600s;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $external_scheme;
    }

    # Other uploads go straight to object storage through presigned URLs; bulk inventory
    # import (5 MiB, admin_api.bulk_import_parsers) is the largest body sent to /api/.
    location /api/ {
        client_max_body_size 10m;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $external_scheme;
    }

    # CONTROL_PLANE_PROXY opts in to the Django control-plane route; default off.
    include /etc/nginx/spaceworks.d/*.conf;

    # Static assets for the admin + API docs (served by WhiteNoise on the backend).
    location /static/ {
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://backend:8000/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $external_scheme;
    }

    # API documentation (drf-spectacular Swagger UI / Redoc / schema).
    location ~ ^/(docs|redoc|schema)/ {
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $external_scheme;
    }

    # Backend embeds own exact-origin framing and referrer policies.
    location /embed/ {
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $external_scheme;
    }
    location ~ ^/(share/|sitemap\.xml$|robots\.txt$) {
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $external_scheme;
    }
    location ~ "^/e/(?<event_code_share_token>[0-9a-fA-F-]{36})/?$" {
        if ($website_crawler) { rewrite ^ /share/e/$event_code_share_token/ last; }
        include /etc/nginx/analytics-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    location ~ "^/e/(?<event_short_code>[0-9A-Za-z]{7})/?$" {
        if ($website_crawler) { rewrite ^ /share/e/$event_short_code/ last; }
        include /etc/nginx/analytics-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    location ~ "^/(?:m/[^/]+/)?events/(?<event_share_token>[0-9a-fA-F-]{36})/?$" {
        if ($website_crawler) { rewrite ^ /share/events/$event_share_token/ last; }
        try_files $uri $uri/ /index.html;
    }

    location ~ "^/e/(?<event_short_token>[0-9a-fA-F-]{36})/?$" {
        if ($website_crawler) { rewrite ^ /share/events/$event_short_token/ last; }
        try_files $uri $uri/ /index.html;
    }

    location ~ "^/(?:m/[^/]+/)?bookings/(?<booking_share_token>[0-9a-fA-F-]{36})/?$" {
        if ($website_crawler) { rewrite ^ /share/bookings/$booking_share_token/ last; }
        try_files $uri $uri/ /index.html;
    }

    location / {
        if ($profile_share_target != "") { rewrite ^ $profile_share_target last; }
        include /etc/nginx/analytics-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
