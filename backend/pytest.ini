[pytest]
DJANGO_SETTINGS_MODULE=config.settings
python_files=test_*.py
testpaths=tests
# The first test also pays for building the test database (migrate: 10-25 min on a CI runner); a shorter
# timeout dumps stacks during that build and the dump itself has segfaulted the process (exit 139).
faulthandler_timeout=3000
markers =
    migration: drives Django's migration executor (slow, memory-heavy); deselect locally with -m "not migration" (decision 487)
