name = "spaceworks-free-web"
main = "worker.mjs"
compatibility_date = "2026-10-18"
workers_dev = true

[assets]
directory = "../../../../frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["*/10 * * * *"]

[vars]
PUBLIC_ORIGIN = "https://spaceworks-free-web.example.workers.dev"
BACKEND_ORIGIN = "https://spaceworks.example.onrender.com"
SPACEWORKS_DEPLOYMENT_PROFILE = "free"
ORIGIN_BOOTSTRAP = "false"
CONNECT_ORIGINS = "https://account.r2.cloudflarestorage.com"
IMAGE_ORIGINS = "https://images.example.org"
MEDIA_ORIGINS = "https://account.r2.cloudflarestorage.com"
ANALYTICS_SCRIPT_ORIGINS = ""
# FREE_TICK_SECRET is provisioned with `wrangler secret put`, never vars/browser env.

[observability]
enabled = false
