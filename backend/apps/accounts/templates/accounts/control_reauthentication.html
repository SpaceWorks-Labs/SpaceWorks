{% extends "admin/base_site.html" %}
{% block content %}
<h1>Confirm your identity</h1>
<p>Verify your current browser session before changing permissions or credentials. Verification lasts ten minutes.</p>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post">{% csrf_token %}
<p><label for="password">Current password</label><input id="password" name="password" type="password" autocomplete="current-password"></p>
<p><label for="code">Authenticator code</label><input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></p>
<button type="submit">Verify identity</button>
</form>
{% endblock %}
