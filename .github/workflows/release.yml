name: Continuous Release
run-name: Release main@${{ github.sha }}

# Every commit that reaches main is a releasable build. VERSION selects the
# release series shown to users; the run number and commit SHA keep the current
# container image retry-safe, for example: 0.5.1-main.42.a1b2c3d4e5f6.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.release.outputs.base }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      series: ${{ steps.release.outputs.series }}
      short_sha: ${{ steps.release.outputs.short_sha }}
      registry_owner: ${{ steps.release.outputs.registry_owner }}
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Build release identifiers
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          base="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=VERSION::VERSION must be a semantic version like 1.0.0 (got '$base')"
            exit 1
          fi

          series="${base%.*}"
          short_sha="${GITHUB_SHA:0:12}"
          registry_owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          version="${base}-main.${GITHUB_RUN_NUMBER}.${short_sha}"

          # A push to main must have changed VERSION (enforced below), so every push cuts a
          # release; a manual run (workflow_dispatch) re-runs the current VERSION.
          release=false
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release=true
          else
            before="${{ github.event.before }}"
            previous=""
            if [[ ! "$before" =~ ^0+$ ]]; then
              if ! previous="$(
                gh api "repos/${GITHUB_REPOSITORY}/contents/VERSION?ref=${before}" \
                  --jq '.content // empty' 2>/dev/null | base64 -d | tr -d '[:space:]'
              )" || [[ -z "$previous" ]]; then
                echo "::error file=VERSION::Could not read VERSION at ${before}. Retry the workflow once the previous revision is available."
                exit 1
              fi
            fi
            if [[ "$previous" == "$base" ]]; then
              echo "::error file=VERSION::VERSION is still ${base}, the same as the previous main commit. Every push to main must bump VERSION (strictly higher semver) - see docs/project/release-process.md. Use workflow_dispatch to re-run an existing version."
              exit 1
            fi
            release=true
          fi

          # A release for this VERSION must not already exist (a manual re-run of the
          # same version via workflow_dispatch is the one deliberate exception).
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            existing="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v${base}" --jq '.[].ref' 2>/dev/null || true)"
            if grep -Eq "^refs/tags/v${base//./\.}(-main\..*)?$" <<<"$existing"; then
              echo "::error file=VERSION::A release/tag for ${base} already exists. Bump VERSION to a new version - see docs/project/release-process.md."
              exit 1
            fi
          fi

          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "series=$series" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "registry_owner=$registry_owner" >> "$GITHUB_OUTPUT"
          echo "Preparing $version"
  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Exactly two published images (owner decision #75a). The one backend image
          # runs every deployment profile, selected at start-up by
          # SPACEWORKS_DEPLOYMENT_MODE / SPACEWORKS_DEPLOYMENT_PROFILE.
          - context: backend
            dockerfile: backend/Dockerfile
            image: spaceworks-backend
            target: release
          - context: frontend
            dockerfile: frontend/Dockerfile
            image: spaceworks-frontend
    steps:
      - uses: actions/checkout@v4

      # The frontend image's build context is ./frontend; /docs reads docs/ through this copy.
      - name: Snapshot docs into the frontend build context
        if: matrix.image == 'spaceworks-frontend'
        run: node frontend/scripts/docs-snapshot.mjs

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ needs.prepare.outputs.registry_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=sha-${{ needs.prepare.outputs.short_sha }}

      - name: Build and publish ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-contexts: cloud_tooling=.
          build-args: |
            POSTGRESQL_CLIENT_MAJOR=17
            POSTGRESQL_LOCAL_SERVER_MAJOR=16
            BUILD_GIT_SHA=${{ github.sha }}
            BUILD_GIT_DESCRIBE=${{ needs.prepare.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Verify the published backend image and architecture metadata
        if: matrix.context == 'backend'
        shell: bash
        env:
          IMAGE: ghcr.io/${{ needs.prepare.outputs.registry_owner }}/${{ matrix.image }}:${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE" --raw > image-index.json
          python3 - <<'PY'
          import json
          index = json.load(open('image-index.json'))
          platforms = {(item['platform']['os'], item['platform']['architecture'])
                       for item in index.get('manifests', []) if 'platform' in item}
          assert {('linux', 'amd64'), ('linux', 'arm64')} <= platforms
          PY
          for platform in linux/amd64 linux/arm64; do
          docker pull --platform "$platform" "$IMAGE"
          docker run --rm --platform "$platform" --entrypoint python "$IMAGE" -c '
          import json, os, shutil
          from pathlib import Path
          import django, rest_framework, anymail, psycopg2, celery, reportlab, PIL
          assert Path("/app/SPACEWORKS_IMAGE_PROFILE").read_text().strip() == "full"
          assert json.loads(Path("/app/BUILD_INFO.json").read_text())["image_profile"] == "full"
          assert Path("/app/staticfiles/staticfiles.json").is_file()
          assert os.getuid() == 10001
          assert shutil.which("ffprobe") and shutil.which("pg_dump")
          for major in (16, 17):
              assert Path(f"/usr/lib/postgresql/{major}/bin/pg_dump").is_file()
          # Managed full/free run from this same image, so its cloud tooling must be present.
          assert Path("/app/scripts/cloud_setup/secret_files.py").is_file()
          assert Path("/app/scripts/init-cloud-environment.py").is_file()
          assert Path("/app/deploy/cloud").is_dir()
          '
          done

  # Installer assets (decision 232): install.sh, the deploy bundle, SHA256SUMS and a keyless
  # cosign signature of SHA256SUMS (GitHub OIDC; no secret or repository setting is needed).
  assets:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: sigstore/cosign-installer@v3.7.0
        with:
          cosign-release: v2.4.1

      - name: Build and sign the installer assets
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/release-assets.sh "$VERSION" "$GITHUB_SHA" release-assets
          cd release-assets
          cosign sign-blob --yes --output-signature SHA256SUMS.sig --output-certificate SHA256SUMS.pem SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error

  github-release:
    needs:
      - prepare
      - publish
      - assets
    # `assets` is skipped (not failed) on pushes that cut no release.
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.publish.result == 'success' && (needs.assets.result == 'success' || needs.assets.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download installer assets
        if: needs.prepare.outputs.release == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets

      - name: Create GitHub Release
        if: needs.prepare.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          # Product name then version, e.g. "SpaceWorks 0.7.5". The immutable `tag_name`
          # above keeps its full `v<base>-main.<run>.<sha>` form -- the title is what a
          # human reads on the releases page, the tag is what a deployment pins to.
          name: SpaceWorks ${{ needs.prepare.outputs.base }}
          generate_release_notes: true
          make_latest: false
          body: |
            Continuous release from `main` at `${{ github.sha }}`.

            Docker images:
            - `ghcr.io/${{ needs.prepare.outputs.registry_owner }}/spaceworks-backend:${{ needs.prepare.outputs.version }}`
            - `ghcr.io/${{ needs.prepare.outputs.registry_owner }}/spaceworks-frontend:${{ needs.prepare.outputs.version }}`

  promote-latest:
    needs:
      - prepare
      - publish
      - github-release
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.head.outputs.current }}
    concurrency:
      group: main-release-promotion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Check whether this is still the main branch head
        id: head
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [[ "$current_sha" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "A newer main commit exists; leaving rolling tags unchanged."
          fi

      - if: steps.head.outputs.current == 'true'
        uses: docker/setup-buildx-action@v3

      - if: steps.head.outputs.current == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote images to rolling tags
        if: steps.head.outputs.current == 'true'
        shell: bash
        env:
          OWNER: ${{ needs.prepare.outputs.registry_owner }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SERIES: ${{ needs.prepare.outputs.series }}
        run: |
          set -euo pipefail
          for package in spaceworks-backend spaceworks-frontend; do
            image="ghcr.io/${OWNER}/${package}"
            docker buildx imagetools create \
              --tag "${image}:${SERIES}" \
              --tag "${image}:main" \
              --tag "${image}:latest" \
              "${image}:${VERSION}"
          done

      - name: Mark this GitHub Release as latest
        if: steps.head.outputs.current == 'true' && needs.prepare.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          make_latest: true

      - name: Prune superseded container versions (release history is kept forever)
        if: steps.head.outputs.current == 'true'
        continue-on-error: true
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ needs.prepare.outputs.tag }}
          OWNER: ${{ needs.prepare.outputs.registry_owner }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SERIES: ${{ needs.prepare.outputs.series }}
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
        run: |
          set -euo pipefail

          retry() {
            local attempt
            for attempt in 1 2 3 4; do
              if "$@"; then
                return 0
              fi
              if [[ "$attempt" == 4 ]]; then
                return 1
              fi
              echo "GitHub API call failed (attempt ${attempt}/4); retrying." >&2
              sleep $((attempt * 2))
            done
          }

          if ! release_tags="$(retry gh release list --limit 1000 --json tagName --jq '.[].tagName')"; then
            echo "::warning::Could not list releases after retries; cleanup will run again on the next release."
            exit 0
          fi
          # RELEASE HISTORY IS PERMANENT (owner decision 2026-09-03). Every published
          # GitHub Release and its Git tag is kept forever -- this step deletes neither,
          # and must not be "restored" to doing so. Container versions are a separate
          # question and are still pruned below, because images consume real registry
          # storage while a release row does not.
          #
          # `gh release list` returns newest first, so the first tag that is not the
          # current one is the immediately previous release. That value is still needed:
          # ghcr-retention.py keeps the previous version's images so the installer's
          # rollback-to-previous-release path has something to fall back to.
          previous_release_tag=""
          while IFS= read -r tag; do
            [[ -z "$tag" || "$tag" == "$CURRENT_TAG" ]] && continue
            previous_release_tag="$tag"
            break
          done <<< "$release_tags"
          previous_version="${previous_release_tag#v}"

          python3 scripts/ghcr-retention.py \
            --owner "$OWNER" \
            --package spaceworks-backend \
            --package spaceworks-frontend \
            --version "$VERSION" \
            --sha-tag "sha-${SHORT_SHA}" \
            --series "$SERIES" \
            --previous-version "$previous_version"

          for package in osmm-backend osmm-frontend; do
            if output="$(retry gh api --method DELETE \
              "orgs/${OWNER}/packages/container/${package}" 2>&1)"; then
              echo "Removed legacy package ${package}."
            elif [[ "$output" == *"HTTP 404"* ]]; then
              echo "Legacy package ${package} is already absent."
            else
              echo "::warning::Could not remove legacy package ${package}: ${output}"
            fi
          done

      # Gated like every other step here: a superseded run must not fail because a
      # newer run's retention has already aged this version out.
      - name: Verify immutable release images are pullable
        if: steps.head.outputs.current == 'true'
        shell: bash
        env:
          GHCR_OWNER: ${{ needs.prepare.outputs.registry_owner }}
        run: ./scripts/verify-release-images.sh "${{ needs.prepare.outputs.version }}"

  # SECURITY: GitHub recommends self-hosted runners only for private repositories.
  # This public repo's runner controls Docker (effectively host root).
  # Require approval for ALL external contributors' workflow runs. Register it
  # only to this repo; restrict its runner group to release.yml on refs/heads/main
  # where available. Never target this runner from a pull_request workflow.
  # No checkout or third-party actions run here. Keep runner auto-updates enabled.
  # SPACEWORKS_DEPLOY is opt-in so repos without a runner never queue this job.
  deploy:
    needs: [prepare, publish, github-release, promote-latest]
    if: github.ref == 'refs/heads/main' && vars.SPACEWORKS_DEPLOY == 'true' && needs.promote-latest.outputs.eligible == 'true'
    runs-on: [self-hosted, spaceworks-prod]
    environment: production
    concurrency: { group: spaceworks-prod-deploy, cancel-in-progress: false }
    permissions: {}
    timeout-minutes: 60
    steps:
      - name: Deploy the published release
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # Recheck after the runner/environment queue: promotion eligibility can age.
          head_json="$(curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/main")"
          [[ "$head_json" =~ \"sha\"[[:space:]]*:[[:space:]]*\"([0-9a-f]{40})\" ]] || exit 1
          if [[ "${BASH_REMATCH[1]}" != "$GITHUB_SHA" ]]; then
            echo 'A newer main commit exists; skipping superseded deployment.'
            exit 0
          fi
          bash "${SPACEWORKS_DIR:-/opt/spaceworks}/scripts/update.sh" --force --no-module-changes --version "$VERSION"
