{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "spaceworks.name" . }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required" .Values.ingress.host | quote }}
      http:
        paths:
{{- if .Values.frontend.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: {{ .Values.service.port }}
{{- else }}
          {{- /* API-only: no website container. Route only what the backend serves; the live path wins by length. */}}
          - path: /api/v1/live
            pathType: Prefix
            backend:
              service:
                name: live
                port:
                  number: 8000
          {{- range .Values.ingress.apiOnlyPaths }}
          - path: {{ . | quote }}
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          {{- end }}
{{- end }}
{{- end }}
