{{- include "spaceworks.validate" . -}}
{{- $releaseValues := deepCopy .Values -}}
{{- if eq .Values.deploymentMode "host" -}}
{{- $_ := set $releaseValues "databasePointerSecret" (required "migrationPointerSecret required in host mode" .Values.migrationPointerSecret) -}}
{{- end -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "spaceworks.name" . }}-{{ if eq .Values.deploymentMode "host" }}migrate{{ else }}release{{ end }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- include "spaceworks.podSecurity" . | nindent 8 }}
      containers:
        - name: release
          image: {{ include "spaceworks.backendImage" . | quote }}
          {{- if eq .Values.deploymentMode "host" }}
          args: [--role, migrate, python, manage.py, migrate, --noinput]
          {{- else }}
          args: [--role, migrate, python, -m, scripts.run_cloud_role, release]
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          envFrom:
            - secretRef:
                name: {{ required "runtimeSecret is required" .Values.runtimeSecret | quote }}
            {{- if eq .Values.deploymentMode "managed" }}
            - secretRef:
                name: {{ required "releaseSecret is required only in finite managed release" .Values.releaseSecret | quote }}
            {{- end }}
          env:
            {{- include "spaceworks.env" (dict "Values" $releaseValues) | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- include "spaceworks.mounts" . | nindent 12 }}
      volumes:
        {{- include "spaceworks.volumes" . | nindent 8 }}
