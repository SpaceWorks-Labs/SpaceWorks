map $http_x_forwarded_proto $external_scheme {
    default $scheme;
    https https;
}
server {
    listen 80;
    server_name _;

    location = /.well-known/assetlinks.json {
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $external_scheme;
    }

    location = /.well-known/apple-app-site-association {
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $external_scheme;
    }

    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    location /embed/ {
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $external_scheme;
    }
    # Shared website multipart ingress; backend enforces the 5 MB decoded input cap.
    location ~ ^/api/v1/admin/(events|event-series|spaces)/[0-9]+/website/assets/$ {
        client_max_body_size 6m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $external_scheme;
    }

    location /api/v1/internal/ { return 403; }
    location /api/v1/live/ {
        proxy_pass http://live:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $external_scheme;
    }
    # Tenant-migration archives: the backend enforces MAX_ARCHIVE_BYTES (20 GiB).
    location = /api/v1/admin/platform/tenant-migrations/imports {
        access_log off;
        client_max_body_size 20g;
        proxy_read_timeout 3600s;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $external_scheme;
    }
    # Other uploads use presigned storage URLs; bulk import (5 MiB) is the largest API body.
    location ~ ^/(api/|static/|docs/|redoc/|schema/|share/|sitemap\.xml$|robots\.txt$) {
        access_log off;
        client_max_body_size 10m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $external_scheme;
    }
    location / { return 404; }
}
