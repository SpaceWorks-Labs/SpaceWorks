name: Tests

# The committed test suites (decision 244: "CI runs the committed backend and frontend suites").
# Checks (checks.yml) stays the fast required gate; this workflow runs the full suites.
#
# Backend: the same isolated runner as local work (`scripts/dev.sh test`): it builds the backend image
# (version-matched pg 16/17 clients, fonts, render deps) and starts a throwaway Postgres 16, Redis and
# object store per shard on a private Docker network. The suite is split into shards by test file.
# Frontend: the whole vitest suite.

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend tests (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4

      - name: Pick this shard's test files
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          find tests -name 'test_*.py' -not -path '*/__pycache__/*' | LC_ALL=C sort \
            | awk -v shard=${{ matrix.shard }} -v total=6 '(NR - 1) % total == shard - 1' > .ci-shard-tests.txt
          echo "Shard ${{ matrix.shard }}: $(wc -l < .ci-shard-tests.txt) test files"

      - name: Run the shard in the isolated test runner
        run: bash scripts/dev.sh test -q @.ci-shard-tests.txt

  frontend:
    name: frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Vitest (whole suite)
        run: npx vitest run --maxWorkers=2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: node:test suites (website serving, documentation contracts)
        working-directory: .
        run: node --test frontend/scripts/verify-website-serving.test.mjs backend/tests/docs/documentation.test.cjs
