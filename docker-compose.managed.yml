# CL-I step-1 preparation: requires reviewed M/E/J runtime and later acceptance.
# Standalone file, NEVER layer over the host/H1 Compose files.
# Run finite `--profile release run --rm release` before `up -d`.
x-spaceworks-preparation: true
x-runtime: &runtime
  MANAGED_UPLOAD_TRANSFER_BOUND_SECONDS: ${MANAGED_UPLOAD_TRANSFER_BOUND_SECONDS:-0}
  CLAMD_HOST: ${CLAMD_HOST:-}
  CLAMD_PORT: ${CLAMD_PORT:-3310}
  CLAMD_TIMEOUT_SECONDS: ${CLAMD_TIMEOUT_SECONDS:-5}
  CLAMD_MAX_SCAN_BYTES: ${CLAMD_MAX_SCAN_BYTES:-2147483648}
  SPACEWORKS_DEPLOYMENT_MODE: managed
  SPACEWORKS_DEPLOYMENT_PROFILE: full
  SPACEWORKS_DEPLOYMENT_ID: ${SPACEWORKS_DEPLOYMENT_ID:?set persistent deployment identity}
  DATABASE_URL: ${DATABASE_URL:?set narrow runtime database URL}
  DATABASE_CONNECTION_MODE: ${DATABASE_CONNECTION_MODE:-direct}
  STORAGE_CAPABILITIES_FILE: ${STORAGE_CAPABILITIES_FILE:-}
  STORAGE_CAPABILITY_TTL_SECONDS: ${STORAGE_CAPABILITY_TTL_SECONDS:-900}
  SPACEWORKS_SECRET_FILE_MODE: ${SPACEWORKS_SECRET_FILE_MODE:-native}
  SPACEWORKS_STORAGE_CAPABILITIES_B64: ${SPACEWORKS_STORAGE_CAPABILITIES_B64:-}
  SPACEWORKS_EMAIL_PROVIDER_CONFIG_B64: ${SPACEWORKS_EMAIL_PROVIDER_CONFIG_B64:-}
  EMAIL_PROVIDER_CONFIG_FILE: ${EMAIL_PROVIDER_CONFIG_FILE:-}
  EMAIL_PROVIDER_WEBHOOKS_ENABLED: ${EMAIL_PROVIDER_WEBHOOKS_ENABLED:-False}
  TRUSTED_EDGE_INGRESS_SECRET: ${TRUSTED_EDGE_INGRESS_SECRET:-}
  TRUST_FORWARDED_HOST: ${TRUST_FORWARDED_HOST:-False}
  TRUSTED_EDGE_CIDRS: ${TRUSTED_EDGE_CIDRS:-}
  TRUSTED_EDGE_UPSTREAM_HOSTS: ${TRUSTED_EDGE_UPSTREAM_HOSTS:-}
  UPLOAD_SCAN_POLICY: ${UPLOAD_SCAN_POLICY:-none}
  MANAGED_POSTGRES: ${MANAGED_POSTGRES:-True}
  CONN_MAX_AGE: ${CONN_MAX_AGE:-60}
  CONN_HEALTH_CHECKS: ${CONN_HEALTH_CHECKS:-True}
  DISABLE_SERVER_SIDE_CURSORS: ${DISABLE_SERVER_SIDE_CURSORS:-False}
  SECRET_KEY: ${SECRET_KEY:?set persistent secret}
  API_CLIENT_ENC_KEY: ${API_CLIENT_ENC_KEY:?set persistent independent Fernet key}
  AUDIT_MAC_MASTER_KEY: ${AUDIT_MAC_MASTER_KEY:?set persistent independent audit key}
  EVENT_STATION_PIN_PEPPER: ${EVENT_STATION_PIN_PEPPER:?set persistent independent pepper}
  DEBUG: "False"
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?set exact API hosts}
  TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:?set exact trusted proxy count}
  PUBLIC_APP_BASE_URL: ${PUBLIC_APP_BASE_URL:?set public frontend URL}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
  PLATFORM_STAFF_ORIGINS: ${PLATFORM_STAFF_ORIGINS:-}
  AUTH_COOKIE_SECURE: "True"
  ENABLE_HTTPS: "True"
  CLOUD_TASK_PROFILE: redis
  CLOUD_SCHEDULER: beat
  CELERY_TASK_ALWAYS_EAGER: "False"
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:?set shared Redis broker URL}
  CACHE_URL: ${CACHE_URL:-}
  LIVE_REDIS_URL: ${LIVE_REDIS_URL:-}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?set verified sender}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
  AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:?set private bucket}
  AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
  AWS_S3_PUBLIC_ENDPOINT_URL: ${AWS_S3_PUBLIC_ENDPOINT_URL:-}
  PUBLIC_IMAGE_BUCKET: ${PUBLIC_IMAGE_BUCKET:?set separate public-final bucket}
  PUBLIC_IMAGE_BASE_URL: ${PUBLIC_IMAGE_BASE_URL:?set public-final origin}
  STORAGE_PRESIGN_METHOD: ${STORAGE_PRESIGN_METHOD:-post}
  PII_ENCRYPTION_ENABLED: ${PII_ENCRYPTION_ENABLED:-False}
  PII_KEY_BROKER: ${PII_KEY_BROKER:-local}
  PII_MASTER_KEY: ${PII_MASTER_KEY:-}
  PII_MASTER_KEY_PREVIOUS: ${PII_MASTER_KEY_PREVIOUS:-}
  PII_SEARCH_HASH_KEY: ${PII_SEARCH_HASH_KEY:-}
  PII_ENCRYPTION_DUAL_READ: ${PII_ENCRYPTION_DUAL_READ:-False}
  PII_DEK_CACHE_TTL_SECONDS: ${PII_DEK_CACHE_TTL_SECONDS:-300}
  PII_AWS_KMS_KEY_ID: ${PII_AWS_KMS_KEY_ID:-}
  PII_AWS_KMS_REGION: ${PII_AWS_KMS_REGION:-}
  PII_AWS_KMS_ENDPOINT_URL: ${PII_AWS_KMS_ENDPOINT_URL:-}
  # Release-1 programme settings, as in docker-compose.prod.yml (each defaults off/empty).
  ACCOUNT_SAVED_DETAILS_ENABLED: "${ACCOUNT_SAVED_DETAILS_ENABLED:-False}"
  ACCOUNT_PII_KEY_BROKER: "${ACCOUNT_PII_KEY_BROKER:-local}"
  ACCOUNT_PII_MASTER_KEY: "${ACCOUNT_PII_MASTER_KEY:-}"
  ACCOUNT_PII_MASTER_KEY_PREVIOUS: "${ACCOUNT_PII_MASTER_KEY_PREVIOUS:-}"
  ACCOUNT_PII_AWS_KMS_KEY_ID: "${ACCOUNT_PII_AWS_KMS_KEY_ID:-}"
  ACCOUNT_SAVED_ASSET_BUDGET_BYTES: "${ACCOUNT_SAVED_ASSET_BUDGET_BYTES:-52428800}"
  ACCOUNT_SAVED_RESUME_SCAN_REQUIRED: "${ACCOUNT_SAVED_RESUME_SCAN_REQUIRED:-False}"
  ACCOUNT_SAVED_RESUME_SCANNER: "${ACCOUNT_SAVED_RESUME_SCANNER:-}"
  EVENT_REGISTRATION_CREDENTIAL_DIGEST_KEY: "${EVENT_REGISTRATION_CREDENTIAL_DIGEST_KEY:-}"
  EVENT_REGISTRATION_CREDENTIAL_KEY_VERSION: "${EVENT_REGISTRATION_CREDENTIAL_KEY_VERSION:-1}"
  EVENT_REGISTRATION_CREDENTIAL_KEYS: "${EVENT_REGISTRATION_CREDENTIAL_KEYS:-{}}"
  EVENT_ASSET_SCAN_BACKEND: "${EVENT_ASSET_SCAN_BACKEND:-none}"
  EVENT_ASSET_CLAMAV_HOST: "${EVENT_ASSET_CLAMAV_HOST:-}"
  EVENT_ASSET_CLAMAV_PORT: "${EVENT_ASSET_CLAMAV_PORT:-3310}"
  UI_DELIGHT_ENABLED: "${UI_DELIGHT_ENABLED:-True}"
  UI_EASTER_EGGS_ENABLED: "${UI_EASTER_EGGS_ENABLED:-True}"
  WEB_ANALYTICS_SCRIPT_URL: ${WEB_ANALYTICS_SCRIPT_URL:-}
  WEB_ANALYTICS_COLLECT_URL: ${WEB_ANALYTICS_COLLECT_URL:-}
  WEB_ANALYTICS_DOMAIN: ${WEB_ANALYTICS_DOMAIN:-}
  NOTIFICATION_SLACK_REDIRECT_URI: ${NOTIFICATION_SLACK_REDIRECT_URI:-}
  NOTIFICATION_MATTERMOST_REDIRECT_URI: ${NOTIFICATION_MATTERMOST_REDIRECT_URI:-}
  NOTIFICATION_DISCORD_REDIRECT_URI: ${NOTIFICATION_DISCORD_REDIRECT_URI:-}
  NOTIFICATION_MATTERMOST_ALLOW_PRIVATE_HOSTS: ${NOTIFICATION_MATTERMOST_ALLOW_PRIVATE_HOSTS:-False}
  WHATSAPP_META_GRAPH_VERSION: ${WHATSAPP_META_GRAPH_VERSION:-v25.0}
  ORGANIZATION_SELF_CREATION_ENABLED: ${ORGANIZATION_SELF_CREATION_ENABLED:-False}
  ORGANIZATION_SELF_CREATION_MAX_OWNED: ${ORGANIZATION_SELF_CREATION_MAX_OWNED:-3}
  ORGANIZATION_SELF_CREATION_MAX_PER_DAY: ${ORGANIZATION_SELF_CREATION_MAX_PER_DAY:-1}
  # Release 2 (0.11.0) operator settings; each default equals settings.py, so leaving
  # them unset changes nothing. Tuning knobs (TTLs, thresholds) stay at their settings
  # defaults; see docs/environment-reference.md.
  TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
  TURNSTILE_FAIL_MODE: ${TURNSTILE_FAIL_MODE:-open}
  TURNSTILE_HOSTNAMES: ${TURNSTILE_HOSTNAMES:-}
  LOGIN_IP_BLOCK_ENABLED: ${LOGIN_IP_BLOCK_ENABLED:-True}
  PASSWORD_BREACH_CHECK_ENABLED: ${PASSWORD_BREACH_CHECK_ENABLED:-True}
  WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Space Works}
  WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
  WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-}
  MESSAGING_WEBHOOK_BASE_URL: ${MESSAGING_WEBHOOK_BASE_URL:-}
  MIN_NATIVE_APP_VERSION_IOS: ${MIN_NATIVE_APP_VERSION_IOS:-}
  MIN_NATIVE_APP_VERSION_ANDROID: ${MIN_NATIVE_APP_VERSION_ANDROID:-}
  CARD_FONT_DOWNLOADS_ENABLED: ${CARD_FONT_DOWNLOADS_ENABLED:-True}
  CARD_PHOTO_MODEL_PATH: ${CARD_PHOTO_MODEL_PATH:-}
x-service: &service
  image: ${MAKERSPACE_BACKEND_IMAGE:?set the reviewed immutable same-build backend image digest}
  restart: unless-stopped
  environment: *runtime
services:
  backend:
    <<: *service
    command: ["--role", "backend", "python", "-m", "scripts.run_cloud_role", "web"]
    ports: ["127.0.0.1:${BACKEND_PORT:-8000}:8000"]
  worker:
    <<: *service
    command: ["--role", "worker", "python", "-m", "scripts.run_cloud_role", "worker"]
  beat:
    <<: *service
    command: ["--role", "beat", "python", "-m", "scripts.run_cloud_role", "beat"]
    volumes: ["celerybeat_data:/var/lib/celery"]
  release:
    <<: *service
    profiles: [release]
    restart: "no"
    command: ["--role", "migrate", "python", "-m", "scripts.run_cloud_role", "release"]
    environment:
      <<: *runtime
      DATABASE_MAINTENANCE_URL: ${DATABASE_MAINTENANCE_URL:-}
      DATABASE_MAINTENANCE_CONNECTION_MODE: ${DATABASE_MAINTENANCE_CONNECTION_MODE:-direct}
volumes:
  celerybeat_data:
